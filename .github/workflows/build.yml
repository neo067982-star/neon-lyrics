name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1'
            loader: '0.20.1'
            loom: '1.15.3'
            fabric_api: '0.145.1+26.1'
            gradle: '9.4.0'
          - minecraft: '26.1.1'
            loader: '0.20.1'
            loom: '1.15.3'
            fabric_api: '0.145.4+26.1.1'
            gradle: '9.4.0'
          - minecraft: '26.1.2'
            loader: '0.20.1'
            loom: '1.15.3'
            fabric_api: '0.155.3+26.1.2'
            gradle: '9.4.0'
          - minecraft: '26.2'
            loader: '0.20.1'
            loom: '1.17.1'
            fabric_api: '0.151.0+26.2'
            gradle: '9.5.1'
          - minecraft: '26.3'
            loader: '0.20.1'
            loom: '1.19-SNAPSHOT'
            fabric_api: '0.162.0+26.3'
            gradle: '9.8.0'

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: build ${{ matrix.minecraft }}
        run: >-
          gradle build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Ploader_version=${{ matrix.loader }}
          -Ploom_version=${{ matrix.loom }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pmod_version=2.1.4+mc${{ matrix.minecraft }}
          -Parchives_base_name=lyricscord-${{ matrix.minecraft }}

      - name: upload ${{ matrix.minecraft }} jars
        uses: actions/upload-artifact@v4
        with:
          name: lyricscord-${{ matrix.minecraft }}-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download jars
        uses: actions/download-artifact@v4
        with:
          pattern: lyricscord-*-jars
          path: release-files
          merge-multiple: true

      - name: make checksums
        run: sha256sum release-files/*.jar > release-files/SHA256SUMS.txt

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: lyricscord ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*

      - name: remove source jars from release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            for (const asset of release.data.assets.filter(asset => asset.name.endsWith('-sources.jar'))) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }
