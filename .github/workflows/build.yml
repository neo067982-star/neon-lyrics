name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: build
        run: gradle build

      - name: make checksums
        run: sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt

      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lyricscord-jars
          path: build/libs/*.jar

      - name: create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar build/libs/SHA256SUMS.txt --title "lyricscord $GITHUB_REF_NAME" --generate-notes
