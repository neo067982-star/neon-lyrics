name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1'
            loader: '0.18.4'
            loom: '1.15.3'
            fabric_api: '0.145.1+26.1'
            gradle: '9.4.0'
          - minecraft: '26.2'
            loader: '0.19.3'
            loom: '1.17.1'
            fabric_api: '0.151.0+26.2'
            gradle: '9.5.1'

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: build ${{ matrix.minecraft }}
        run: >-
          gradle build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Ploader_version=${{ matrix.loader }}
          -Ploom_version=${{ matrix.loom }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pmod_version=2.1.0+mc${{ matrix.minecraft }}
          -Parchives_base_name=lyricscord-${{ matrix.minecraft }}

      - name: upload ${{ matrix.minecraft }} jars
        uses: actions/upload-artifact@v4
        with:
          name: lyricscord-${{ matrix.minecraft }}-jars
          path: build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download jars
        uses: actions/download-artifact@v4
        with:
          pattern: lyricscord-*-jars
          path: release-files
          merge-multiple: true

      - name: make checksums
        run: sha256sum release-files/*.jar > release-files/SHA256SUMS.txt

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --title "lyricscord $GITHUB_REF_NAME" --generate-notes
